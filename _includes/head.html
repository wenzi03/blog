<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">

<title>
  {% if page.title %}
    {{ page.title | escape }} · {{ site.title | escape }}
  {% else %}
    {{ site.title | escape }}
  {% endif %}
</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<link rel="preload" href="{{ '/assets/fonts/anthropic-sans-web-text.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/anthropic-serif-web-text.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
